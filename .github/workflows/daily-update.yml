name: Daily video data refresh

on:
  schedule:
    # 06:00 UTC every day — comfortably after most Yogscast uploads land,
    # and well within the free Actions minutes for a repo this small.
    - cron: "0 6 * * *"
  workflow_dispatch: {} # lets you trigger it manually from the Actions tab

permissions:
  contents: write

jobs:
  update-dataset:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Fetch new videos
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: node scripts/update.js

      - name: Commit updated dataset (if anything changed)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/data/videos-all.json docs/data/videos-by-day.json
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Update video dataset"
            git push
          fi

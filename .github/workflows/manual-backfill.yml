name: Manual full backfill

# Re-fetches the ENTIRE channel from scratch and overwrites the dataset.
# Use this after changing what the pipeline captures (e.g. adding view
# counts or descriptions), or to pick up channels added later. Trigger it
# by hand from the Actions tab — "Run workflow".

on:
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  backfill-dataset:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Run full backfill
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: node scripts/backfill.js

      - name: Commit updated dataset (if anything changed)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/data/videos-all.json docs/data/videos-by-day.json
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Full backfill refresh"
            git push
          fi

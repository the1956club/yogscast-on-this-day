<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Custom Filter — On This Day in Yogscast History</title>
  <meta name="description" content="Search, or pick any date, game or series, and browse the Yogscast main-channel videos that match." />

  <!-- AdSense: once your site is approved, paste your AdSense loader script
       here (see README.md > "Adding AdSense"). Left out until then. -->

  <!-- Applies a saved light/dark choice before the page paints, so there's
       no flash of the wrong theme on load. Falls back to the OS preference
       (via the prefers-color-scheme CSS below) until the switch is used. -->
  <script>
    (function () {
      try {
        var stored = localStorage.getItem("theme");
        if (stored === "light" || stored === "dark") {
          document.documentElement.setAttribute("data-theme", stored);
        }
      } catch (err) {}
    })();
  </script>

  <!-- Clean addresses: the site lives at /, /filter and /about. GitHub Pages
       still serves the old .html addresses, so if someone arrives on one,
       quietly tidy what the address bar shows, and tell search engines which
       address is the real one. -->
  <link rel="canonical" href="https://the1956club.com/filter" />
  <script>
    if (/\.html$/.test(location.pathname)) {
      history.replaceState(null, "", location.pathname.replace(/(index)?\.html$/, "") + location.search + location.hash);
    }
  </script>

  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <!-- Ad slot: swap this div for your AdSense <ins> tag once approved. -->
  <div class="ad-slot" id="ad-slot-top" aria-hidden="true"></div>

  <main>
    <img class="site-banner" src="image.png" alt="The Yogscast Nostalgia Machine (fan made)" width="1200" height="500" />

    <nav class="site-nav" aria-label="Primary">
      <a class="site-nav-link" href="/">Home</a>
      <a class="site-nav-link" href="/filter" aria-current="page">Custom Filter</a>
      <a class="site-nav-link" href="/about">About</a>
    </nav>

    <header class="page-header">
      <p class="today-label">Choose your feed</p>
      <button type="button" class="theme-toggle" id="theme-toggle" aria-label="Switch to light mode" aria-pressed="false">
        <svg class="theme-toggle-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <circle cx="12" cy="12" r="4"></circle>
          <path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"></path>
        </svg>
        <span class="theme-toggle-track">
          <span class="theme-toggle-thumb"></span>
        </span>
        <svg class="theme-toggle-icon" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
          <path d="M21 12.79A9 9 0 1111.21 3 7 7 0 0021 12.79z"></path>
        </svg>
      </button>
    </header>

    <!-- A title search plus three independent filters, all combinable. The
         search matches every typed word anywhere in a title. The filters: a
         date (no year —
         the calendar just loops the 12 months forever, since the site only
         ever looks videos up by month + day), a game and a series (each
         checked off a multi-select list built from the video titles — see
         scripts/lib/tags.js). None is pre-selected, so a first-time visitor
         sees an empty page until they choose something. Games/series with
         no date browse every day; a date on its own shows that day's
         videos; any combination narrows to videos matching all of them. -->
    <section class="date-filter">
      <div class="filter-group filter-group-search">
        <label class="date-filter-label" for="video-search">Search videos</label>
        <div class="video-search">
          <svg class="date-picker-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <circle cx="11" cy="11" r="7"></circle>
            <path d="M20 20l-3.5-3.5"></path>
          </svg>
          <input
            type="search"
            id="video-search"
            class="video-search-input"
            placeholder="Search titles&hellip;"
            autocomplete="off"
            spellcheck="false"
          />
        </div>
      </div>

      <div class="filter-group">
        <span class="date-filter-label" id="date-picker-label">Pick a date</span>
        <div class="date-picker" id="date-picker">
          <button
            type="button"
            class="date-picker-trigger"
            id="date-picker-trigger"
            aria-haspopup="true"
            aria-expanded="false"
            aria-labelledby="date-picker-label date-picker-value"
          >
            <span id="date-picker-value">Pick a date</span>
            <svg class="date-picker-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <rect x="3" y="4" width="18" height="18" rx="2"></rect>
              <path d="M16 2v4M8 2v4M3 10h18"></path>
            </svg>
          </button>

          <div class="date-picker-panel" id="date-picker-panel" hidden>
            <div class="date-picker-panel-header">
              <button type="button" class="date-picker-nav" id="date-picker-prev" aria-label="Previous month">&#10094;</button>
              <span class="date-picker-month" id="date-picker-month"></span>
              <button type="button" class="date-picker-nav" id="date-picker-next" aria-label="Next month">&#10095;</button>
            </div>
            <div class="date-picker-weekdays" aria-hidden="true">
              <span>Su</span><span>Mo</span><span>Tu</span><span>We</span><span>Th</span><span>Fr</span><span>Sa</span>
            </div>
            <div class="date-picker-days" id="date-picker-days"></div>
          </div>
        </div>
      </div>

      <div class="filter-group">
        <span class="date-filter-label" id="game-picker-label">Filter by game</span>
        <div class="game-picker" id="game-picker">
          <button
            type="button"
            class="date-picker-trigger"
            id="game-picker-trigger"
            aria-haspopup="true"
            aria-expanded="false"
            aria-labelledby="game-picker-label game-picker-value"
          >
            <span id="game-picker-value">All games</span>
            <svg class="date-picker-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M6 9l6 6 6-6"></path>
            </svg>
          </button>

          <div class="game-picker-panel" id="game-picker-panel" hidden>
            <div class="game-picker-panel-header">
              <span class="game-picker-panel-title">Filter by game</span>
              <button type="button" class="game-picker-clear" id="game-picker-clear">Clear</button>
            </div>
            <div class="game-picker-scroll">
              <div class="game-picker-list" id="game-picker-list"></div>
            </div>
          </div>
        </div>
      </div>

      <div class="filter-group">
        <span class="date-filter-label" id="series-picker-label">Filter by series</span>
        <div class="game-picker" id="series-picker">
          <button
            type="button"
            class="date-picker-trigger"
            id="series-picker-trigger"
            aria-haspopup="true"
            aria-expanded="false"
            aria-labelledby="series-picker-label series-picker-value"
          >
            <span id="series-picker-value">All series</span>
            <svg class="date-picker-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M6 9l6 6 6-6"></path>
            </svg>
          </button>

          <div class="game-picker-panel" id="series-picker-panel" hidden>
            <div class="game-picker-panel-header">
              <span class="game-picker-panel-title">Filter by series</span>
              <button type="button" class="game-picker-clear" id="series-picker-clear">Clear</button>
            </div>
            <div class="game-picker-scroll">
              <div class="game-picker-list" id="series-picker-list"></div>
            </div>
          </div>
        </div>
      </div>
    </section>

    <!-- Clicking any video card plays it here instead of in the card itself
         — a single fixed player, not a carousel. Hidden until something's
         actually playing. -->
    <section class="now-playing" id="now-playing" hidden>
      <div class="now-playing-frame" id="now-playing-frame"></div>
      <p class="now-playing-title" id="now-playing-title"></p>
      <p class="now-playing-meta" id="now-playing-meta"></p>
    </section>

    <p class="status" id="status">Loading&hellip;</p>

    <h2 class="section-heading" id="more-heading" hidden>Videos on this day</h2>

    <!-- Sort order for the results, plus the Autoplay switch: when on, the
         next video in this order starts by itself once the playing one
         finishes. -->
    <div class="results-toolbar" id="results-toolbar" hidden>
      <label class="results-sort">
        <span class="results-sort-label">Sort by</span>
        <select id="results-sort">
          <option value="newest">Newest first</option>
          <option value="oldest">Oldest first</option>
          <option value="views">Most viewed</option>
          <option value="title">Title (A&ndash;Z)</option>
        </select>
      </label>
      <label class="autoplay-toggle" id="autoplay-wrap" hidden>
        <input type="checkbox" id="autoplay-toggle" checked />
        <span class="autoplay-switch" aria-hidden="true"><span class="autoplay-knob"></span></span>
        <span>Autoplay</span>
      </label>
    </div>
    <div id="results"></div>

    <h2 class="section-heading" id="shorts-heading" hidden>Shorts on this day</h2>
    <div id="shorts-results"></div>
  </main>

  <div class="ad-slot" id="ad-slot-bottom" aria-hidden="true"></div>

  <footer class="site-footer">
    <p>Fan-made, not affiliated with The Yogscast. Video data via the YouTube Data API.</p>
  </footer>

  <script src="theme.js"></script>
  <script src="filter.js"></script>
</body>
</html>

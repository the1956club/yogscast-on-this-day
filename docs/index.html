<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>On This Day in Yogscast History</title>
  <meta name="description" content="See which Yogscast videos were uploaded on this exact date across the years." />

  <!-- AdSense: once your site is approved, paste your AdSense loader script
       here (see README.md > "Adding AdSense"). Left out until then. -->

  <!-- Applies a saved light/dark choice before the page paints, so there's
       no flash of the wrong theme on load. Falls back to the OS preference
       (via the prefers-color-scheme CSS below) until the switch is used. -->
  <script>
    (function () {
      try {
        var stored = localStorage.getItem("theme");
        if (stored === "light" || stored === "dark") {
          document.documentElement.setAttribute("data-theme", stored);
        }
      } catch (err) {}
    })();
  </script>

  <!-- Google Analytics (GA4). Visitors can switch it off from the About
       page: that sets "analytics-optout" in their browser, and Google's
       ga-disable flag below then stops anything being sent. -->
  <script>
    (function () {
      try {
        if (localStorage.getItem("analytics-optout") === "1") {
          window["ga-disable-G-VZWF0QL5R6"] = true;
        }
      } catch (err) {}
    })();
  </script>
  <!-- Google tag (gtag.js) -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-VZWF0QL5R6"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());

    gtag('config', 'G-VZWF0QL5R6');
  </script>

  <!-- Clean addresses: the site lives at /, /filter and /about. GitHub Pages
       still serves the old .html addresses, so if someone arrives on one,
       quietly tidy what the address bar shows, and tell search engines which
       address is the real one. -->
  <link rel="canonical" href="https://the1956club.com/" />
  <script>
    if (/\.html$/.test(location.pathname)) {
      history.replaceState(null, "", location.pathname.replace(/(index)?\.html$/, "") + location.search + location.hash);
    }
  </script>

  <!-- Link previews (Reddit, Discord, Twitter/X, iMessage...): the title,
       description and 1200x630 image shown when someone shares the site. -->
  <meta property="og:type" content="website" />
  <meta property="og:site_name" content="On This Day in Yogscast History" />
  <meta property="og:title" content="On This Day in Yogscast History" />
  <meta property="og:description" content="See every Yogscast video uploaded on today's date, across every year of the channel. Fan-made." />
  <meta property="og:url" content="https://the1956club.com/" />
  <meta property="og:image" content="https://the1956club.com/og-image.png" />
  <meta property="og:image:width" content="1200" />
  <meta property="og:image:height" content="630" />
  <meta property="og:image:alt" content="The Yogscast Nostalgia Machine (fan made) — every Yogscast video uploaded on today's date" />
  <meta name="twitter:card" content="summary_large_image" />

  <!-- Site icons: tab icon (.ico for older browsers, PNGs for the rest),
       iPhone home-screen icon, and the Android/Google icons via the
       manifest. -->
  <link rel="icon" href="/favicon.ico" sizes="48x48" />
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
  <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16.png" />
  <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
  <link rel="manifest" href="/site.webmanifest" />

  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <!-- Ad slot: swap this div for your AdSense <ins> tag once approved. -->
  <div class="ad-slot" id="ad-slot-top" aria-hidden="true"></div>

  <main>
    <img class="site-banner" src="image.png" alt="The Yogscast Nostalgia Machine (fan made)" width="1200" height="500" />

    <nav class="site-nav" aria-label="Primary">
      <a class="site-nav-link" href="/" aria-current="page">Home</a>
      <a class="site-nav-link" href="/filter">Custom Filter</a>
      <a class="site-nav-link" href="/about">About</a>
    </nav>

    <header class="page-header">
      <p class="today-label" id="today-label">On the &hellip;</p>
      <button type="button" class="theme-toggle" id="theme-toggle" aria-label="Switch to light mode" aria-pressed="false">
        <svg class="theme-toggle-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <circle cx="12" cy="12" r="4"></circle>
          <path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"></path>
        </svg>
        <span class="theme-toggle-track">
          <span class="theme-toggle-thumb"></span>
        </span>
        <svg class="theme-toggle-icon" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
          <path d="M21 12.79A9 9 0 1111.21 3 7 7 0 0021 12.79z"></path>
        </svg>
      </button>
    </header>

    <div class="current-info" id="current-info" hidden>
      <p class="current-year" id="current-year"></p>
      <h2 class="current-title" id="current-title"></h2>
    </div>

    <p class="status" id="status">Loading&hellip;</p>

    <section class="carousel-wrap" id="carousel-wrap" hidden>
      <button type="button" class="carousel-arrow carousel-arrow-left" id="carousel-prev" aria-label="Previous video">&#10094;</button>
      <div class="carousel-viewport" id="carousel-viewport">
        <div class="carousel-track" id="carousel-track"></div>
      </div>
      <button type="button" class="carousel-arrow carousel-arrow-right" id="carousel-next" aria-label="Next video">&#10095;</button>
    </section>

    <div class="below-carousel">
      <p class="current-views" id="current-views" hidden></p>
      <!-- When on, the next video in the carousel starts by itself once the
           current one finishes. Hidden when there's only one video today. -->
      <label class="autoplay-toggle" id="autoplay-wrap" hidden>
        <input type="checkbox" id="autoplay-toggle" checked />
        <span class="autoplay-switch" aria-hidden="true"><span class="autoplay-knob"></span></span>
        <span>Autoplay</span>
      </label>
    </div>
    <p class="current-desc" id="current-desc" hidden></p>

    <h2 class="section-heading" id="more-heading" hidden>Also on this day</h2>
    <div id="results"></div>

    <h2 class="section-heading" id="shorts-heading" hidden>Shorts on this day</h2>
    <div id="shorts-results"></div>
  </main>

  <div class="ad-slot" id="ad-slot-bottom" aria-hidden="true"></div>

  <footer class="site-footer">
    <p>Fan-made, not affiliated with The Yogscast. Video data via the YouTube Data API. <a href="/about#privacy">Analytics &amp; privacy</a></p>
  </footer>

  <script src="theme.js"></script>
  <script src="app.js"></script>
</body>
</html>
